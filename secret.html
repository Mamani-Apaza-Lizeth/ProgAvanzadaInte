<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Callejón — Muro Secreto</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --night: #241B36;
      --night-2: #2F2452;
      --gold: #E8C468;
      --rose: #F2A6B0;
      --sage: #A8D8C9;
      --lilac: #C9B6F2;
      --text: #ECE7F6;
    }

    body {
      background-color: var(--night);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .navbar-secret {
      background: linear-gradient(90deg, var(--night-2) 0%, var(--night) 100%);
      border-bottom: 1px solid rgba(232, 196, 104, 0.35);
    }

    .dark-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(232, 196, 104, 0.2);
      border-radius: 16px;
      backdrop-filter: blur(10px);
    }

    .dark-input {
      background: rgba(108, 107, 107, 0.08) !important;
      border: 1px solid rgba(201, 182, 242, 0.35) !important;
      color: rgb(123, 121, 121) !important;
      border-radius: 10px;
    }
    .dark-input::placeholder { color: rgba(236, 231, 246, 0.45); }

    .btn-neon {
      background: linear-gradient(90deg, var(--lilac) 0%, var(--gold) 100%);
      border: none;
      color: var(--night);
      font-weight: 700;
      border-radius: 10px;
    }
    .btn-neon:hover {
      box-shadow: 0 0 15px rgba(232, 196, 104, 0.5);
      color: var(--night);
    }

    .btn-gold {
      background: var(--gold);
      border: none;
      color: var(--night);
      font-weight: 700;
    }
    .btn-gold:hover { background: #f0d489; color: var(--night); }

    .btn-reaction {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(236, 231, 246, 0.25);
      color: var(--text);
      border-radius: 20px;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-reaction.turbio:hover     { background: var(--rose);  border-color: var(--rose);  color: var(--night); }
    .btn-reaction.confirmado:hover { background: var(--sage);  border-color: var(--sage);  color: var(--night); }
    .btn-reaction.funa:hover       { background: var(--lilac); border-color: var(--lilac); color: var(--night); }

    .badge-afectado {
      background: rgba(232, 196, 104, 0.18);
      border: 1px solid rgba(232, 196, 104, 0.4);
      color: var(--gold);
    }

    .activity-feed-box {
      max-height: 320px;
      overflow-y: auto;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85rem;
    }

    .feed-item {
      border-left: 2px solid var(--lilac);
      padding-left: 10px;
      margin-bottom: 8px;
      opacity: 0.85;
    }

    .text-muted-soft { color: rgba(236, 231, 246, 0.6); }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark navbar-secret mb-4">
    <div class="container">
      <!-- ✅ CORREGIDO: Ruta relativa (sin la barra inicial /) -->
      <a class="navbar-brand fw-bold" href="secret.html" style="color: var(--gold)">
        <i class="bi bi-incognito me-2"></i> El Callejon Muajaja
        <span class="badge rounded-pill ms-2" style="background: var(--rose); color: var(--night);">Restringido</span>
      </a>
      <a href="estudiante.html" class="btn btn-outline-light btn-sm rounded-pill">
        <i class="bi bi-box-arrow-left me-1"></i> Volver al Portal
      </a>
    </div>
  </nav>

  <div class="container mb-5">
    <div class="row g-4">

      <!-- COLUMNA IZQUIERDA: Formulario + Muro de Chismes -->
      <div class="col-lg-8">

        <div class="dark-card p-4 mb-4">
          <h5 class="fw-bold mb-3" style="color: var(--gold)">
            <i class="bi bi-megaphone-fill me-2"></i> ¿Sabes cosas de alguien? Cuentanoslo...
          </h5>
          <form id="form-chisme">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small text-muted-soft">¿Quien es el involucrado?</label>
                <select class="form-select dark-input" id="chisme-afectado" required>
                  <option value="">Selecciona quien esta en el ojo de la tormenta...</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label small text-muted-soft">Tu apodo (opcional)</label>
                <input type="text" class="form-control dark-input" id="chisme-alias" placeholder="Ej. ElDetective / Anónimo">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small text-muted-soft">El Chisme o Prueba</label>
              <textarea class="form-control dark-input" id="chisme-texto" rows="3" placeholder="Escribe el chisme con lujo de detalles..." required></textarea>
            </div>

            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
              <div>
                <input type="file" id="chisme-foto" accept="image/*" class="d-none">
                <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill" onclick="document.getElementById('chisme-foto').click()">
                  <i class="bi bi-camera-fill me-1"></i> Adjuntar Captura
                </button>
                <span id="foto-filename" class="small text-muted-soft ms-2"></span>
              </div>
              <button type="submit" id="btn-publicar" class="btn btn-neon px-4 py-2">Publicar</button>
            </div>
          </form>
        </div>

        <h5 class="fw-bold mb-3"><i class="bi bi-newspaper me-2"></i> Muro Reciente</h5>
        <div id="muro-chismes" class="d-flex flex-column gap-3">
          <p class="text-muted-soft" id="muro-loading">Cargando chismes...</p>
        </div>
      </div>

      <!-- COLUMNA DERECHA: Panel Docente + Feed de Actividad -->
      <div class="col-lg-4">

        <div id="panel-tribunal" class="dark-card p-3 mb-4 d-none" style="border-color: rgba(232,196,104,0.5);">
          <h6 class="fw-bold mb-2" style="color: var(--gold)"><i class="bi bi-gavel me-2"></i> Tribunal de Condenas</h6>
          <p class="small text-muted-soft mb-3">Solo el docente puede dictar sentencias.</p>
          <form id="form-condena">
            <select class="form-select dark-input form-select-sm mb-2" id="condena-alumno" required>
              <option value="">Seleccionar pecador a condenar...</option>
            </select>
            <input type="text" class="form-control dark-input form-control-sm mb-2" id="condena-texto" placeholder="Ej: Traer galletas / Ejercicio en pizarra" required>
            <button type="submit" class="btn btn-gold btn-sm w-100">Dictar Sentencia</button>
          </form>
        </div>

        <div class="dark-card p-3">
          <h6 class="fw-bold mb-3"><i class="bi bi-activity me-2" style="color: var(--lilac)"></i> Feed de Actividad</h6>
          <div class="activity-feed-box" id="activity-feed">
            <p class="text-muted-soft small">Cargando actividad...</p>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://lpgesqdonpofoerpopkk.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_utnY7OECRDGSr5bbOixnFQ__W4iaOGH";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    // ✅ Guard de acceso validando Roles y Privilegios
    const usuarioActivo = JSON.parse(sessionStorage.getItem("usuarioActivo") || "null");

// ✅ Guard de acceso alineado con index.html
const usuarioActivo = JSON.parse(sessionStorage.getItem("usuarioActivo") || "null");

  if (!usuarioActivo) {
    // Sin sesión -> al login
    window.location.href = "index.html";
  } else if (usuarioActivo.rol === "estudiante") {
    // Si su rol es estrictamente 'estudiante', rebota
    window.location.href = "estudiante.html";
  }
  // Si es 'docente' o 'privilegiado', se queda en secret.html sin rebotar

    const esDocente = usuarioActivo && usuarioActivo.rol === "docente";
    if (esDocente) {
      document.getElementById("panel-tribunal").classList.remove("d-none");
    }

    let todosLosUsuarios = [];
    let archivoSeleccionado = null;

    document.getElementById("chisme-foto").addEventListener("change", (e) => {
      archivoSeleccionado = e.target.files[0] || null;
      document.getElementById("foto-filename").textContent = archivoSeleccionado ? archivoSeleccionado.name : "";
    });

    // Registra un evento en el feed (tabla feed_eventos)
    async function registrarEvento(tipo, descripcion) {
      await supabaseClient.from("feed_eventos").insert([{ tipo, descripcion }]);
    }

    // -------------------- Cargar personas para los selects --------------------
    async function cargarUsuarios() {
      const { data, error } = await supabaseClient
        .from("usuarios")
        .select("id, nombre_completo, rol")
        .order("nombre_completo", { ascending: true });

      if (error) { console.error(error); return; }
      todosLosUsuarios = data;

      const selectAfectado = document.getElementById("chisme-afectado");
      data
        .filter((u) => u.id !== usuarioActivo.id)
        .forEach((u) => {
          selectAfectado.innerHTML += `<option value="${u.id}">${u.nombre_completo}</option>`;
        });

      if (esDocente) {
        const selectCondena = document.getElementById("condena-alumno");
        data
          .filter((u) => u.rol !== "docente")
          .forEach((u) => {
            selectCondena.innerHTML += `<option value="${u.id}">${u.nombre_completo}</option>`;
          });
      }
    }

    // -------------------- Muro de chismes --------------------
    async function cargarMuro() {
      const { data: chismes, error } = await supabaseClient
        .from("chismes")
        .select("*, afectado:afectado_id (nombre_completo)")
        .order("created_at", { ascending: false })
        .limit(30);

      document.getElementById("muro-loading").classList.add("d-none");

      if (error) { console.error(error); return; }

      const ids = chismes.map((c) => c.id);
      let reacciones = [];
      if (ids.length > 0) {
        const { data: reaccionesData } = await supabaseClient
          .from("reacciones")
          .select("chisme_id, tipo")
          .in("chisme_id", ids);
        reacciones = reaccionesData || [];
      }

      renderMuro(chismes, reacciones);
    }

    function contarReacciones(chismeId, reacciones) {
      const conteo = { turbio: 0, confirmado: 0, funa: 0 };
      reacciones
        .filter((r) => r.chisme_id === chismeId)
        .forEach((r) => conteo[r.tipo]++);
      return conteo;
    }

    function renderMuro(chismes, reacciones) {
      const container = document.getElementById("muro-chismes");
      container.innerHTML = "";

      if (chismes.length === 0) {
        container.innerHTML = `<p class="text-muted-soft">Todavía no hay chismes. ¡Sé el primero!</p>`;
        return;
      }

      chismes.forEach((item) => {
        const conteo = contarReacciones(item.id, reacciones);
        container.innerHTML += `
          <div class="dark-card p-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="badge badge-afectado">Afectado: ${item.afectado?.nombre_completo || "—"}</span>
              <span class="small text-muted-soft">Por: <b>${item.alias}</b></span>
            </div>
            <p class="mb-3">${item.contenido}</p>
            ${item.foto_url ? `<img src="${item.foto_url}" class="img-fluid rounded mb-3" style="max-height:220px;">` : ""}
            <div class="d-flex gap-2 border-top pt-2 mt-2" style="border-color: rgba(232,196,104,0.2) !important;">
              <button class="btn btn-reaction turbio" onclick="reaccionar('${item.id}', 'turbio')">😱 Turbio (${conteo.turbio})</button>
              <button class="btn btn-reaction confirmado" onclick="reaccionar('${item.id}', 'confirmado')">😂 Confirmado (${conteo.confirmado})</button>
              <button class="btn btn-reaction funa" onclick="reaccionar('${item.id}', 'funa')">🤫 Funa (${conteo.funa})</button>
            </div>
          </div>
        `;
      });
    }

    async function reaccionar(chismeId, tipo) {
      const { error } = await supabaseClient
        .from("reacciones")
        .insert([{ chisme_id: chismeId, usuario_ru: usuarioActivo.ru, tipo }]);

      if (error) {
        return;
      }

      const chisme = (await supabaseClient.from("chismes").select("afectado_id, afectado:afectado_id(nombre_completo)").eq("id", chismeId).single()).data;
      await registrarEvento("reaccion", `🔥 Alguien reaccionó con "${tipo}" a un chisme sobre ${chisme?.afectado?.nombre_completo || "alguien"}.`);

      cargarMuro();
      cargarFeed();
    }

    // -------------------- Publicar chisme --------------------
    document.getElementById("form-chisme").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn-publicar");
      btn.disabled = true;
      btn.textContent = "Publicando...";

      const afectadoId = document.getElementById("chisme-afectado").value;
      const alias = document.getElementById("chisme-alias").value.trim() || "Anónimo";
      const texto = document.getElementById("chisme-texto").value.trim();

      let fotoUrl = null;
      if (archivoSeleccionado) {
        const nombreArchivo = `${Date.now()}_${archivoSeleccionado.name}`;
        const { data: uploadData, error: uploadError } = await supabaseClient.storage
          .from("capturas")
          .upload(nombreArchivo, archivoSeleccionado);

        if (!uploadError) {
          const { data: publicUrlData } = supabaseClient.storage.from("capturas").getPublicUrl(nombreArchivo);
          fotoUrl = publicUrlData.publicUrl;
        }
      }

      const { error } = await supabaseClient.from("chismes").insert([
        {
          autor_id: usuarioActivo.id,
          alias: alias,
          afectado_id: afectadoId,
          contenido: texto,
          foto_url: fotoUrl,
        },
      ]);

      if (!error) {
        const afectadoNombre = todosLosUsuarios.find((u) => u.id === afectadoId)?.nombre_completo || "alguien";
        await registrarEvento("chisme", `📢 @${alias} publicó un chisme sobre ${afectadoNombre}.`);
        e.target.reset();
        archivoSeleccionado = null;
        document.getElementById("foto-filename").textContent = "";
        cargarMuro();
        cargarFeed();
      }

      btn.disabled = false;
      btn.textContent = "Publicar";
    });

    // -------------------- Tribunal (solo docente) --------------------
    const formCondena = document.getElementById("form-condena");
    if (formCondena) {
      formCondena.addEventListener("submit", async (e) => {
        e.preventDefault();
        const alumnoId = document.getElementById("condena-alumno").value;
        const sentencia = document.getElementById("condena-texto").value.trim();

        const { error } = await supabaseClient.from("condenas").insert([
          { estudiante_id: alumnoId, docente_ru: usuarioActivo.ru, sentencia },
        ]);

        if (!error) {
          const alumnoNombre = todosLosUsuarios.find((u) => u.id === alumnoId)?.nombre_completo || "un estudiante";
          await registrarEvento("condena", `⚖️ SENTENCIA: ${alumnoNombre} ha sido condenado a "${sentencia}".`);
          e.target.reset();
          cargarFeed();
        }
      });
    }

    // -------------------- Feed de actividad (con tiempo real) --------------------
    async function cargarFeed() {
      const { data, error } = await supabaseClient
        .from("feed_eventos")
        .select("*")
        .order("created_at", { ascending: false })
        .limit(20);

      if (error) { console.error(error); return; }
      renderFeed(data);
    }

    function renderFeed(eventos) {
      const feedBox = document.getElementById("activity-feed");
      feedBox.innerHTML = "";
      if (eventos.length === 0) {
        feedBox.innerHTML = `<p class="text-muted-soft small">Todavía no hay actividad.</p>`;
        return;
      }
      eventos.forEach((ev) => {
        feedBox.innerHTML += `<div class="feed-item">${ev.descripcion}</div>`;
      });
    }

    supabaseClient
      .channel("feed_eventos-changes")
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "feed_eventos" }, () => {
        cargarFeed();
      })
      .subscribe();

    // -------------------- Inicializar --------------------
    cargarUsuarios().then(() => {
      cargarMuro();
      cargarFeed();
    });
  </script>
</body>
</html>
