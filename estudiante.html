<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal del Curso — Directorio Oficial</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-main: #0b0f19;
      --navbar-bg: linear-gradient(90deg, #1e1b4b 0%, #312e81 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(165, 180, 252, 0.2);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-lavender: #c999c9e6;
      --accent-mint: #2dd4bf;
      --accent-glow: rgba(192, 132, 252, 0.35);
      --plum-dark: #372C6E;
    }

    body {
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(45, 212, 191, 0.1) 0px, transparent 50%);
      color: var(--text-primary);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
    }

    .navbar-custom {
      background: var(--navbar-bg);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .student-card {
      border: 1px solid var(--card-border);
      border-radius: 16px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      background-color: var(--card-bg);
      backdrop-filter: blur(8px);
      color: var(--text-primary);
    }

    .student-card:hover {
      transform: translateY(-6px);
      border-color: var(--accent-lavender);
      box-shadow: 0 10px 30px -10px var(--accent-glow);
    }

    .avatar-circle {
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid var(--accent-lavender);
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto;
      box-shadow: 0 0 15px rgba(192, 132, 252, 0.2);
      overflow: hidden;
    }

    .badge-respeto {
      background-color: rgba(45, 212, 191, 0.15);
      color: var(--accent-mint);
      border: 1px solid rgba(45, 212, 191, 0.3);
      font-weight: 600;
      border-radius: 20px;
      padding: 4px 12px;
    }

    .search-wrap .input-group-text,
    .search-wrap .form-control {
      background-color: rgba(15, 23, 42, 0.8);
      border-color: var(--card-border);
      color: var(--text-primary);
    }

    .search-wrap .form-control:focus {
      border-color: var(--accent-mint);
      box-shadow: 0 0 12px rgba(45, 212, 191, 0.3);
    }

    .search-wrap .form-control::placeholder {
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        <i class="bi bi-mortarboard-fill me-2"></i> Portal Universitario
      </a>
      <div class="d-flex align-items-center gap-3">
        <a id="user-display" href="perfil.html" class="text-light text-decoration-none small">
          <i class="bi bi-person-circle"></i> Mi Perfil
        </a>
        <a href="secret.html" id="btn-modo-privado" class="btn btn-outline-light btn-sm rounded-pill d-none">
          <i class="bi bi-shield-lock-fill"></i> Modo Privado
        </a>
        <button onclick="cerrarSesion()" class="btn btn-danger btn-sm rounded-pill">
          <i class="bi bi-box-arrow-right"></i> Salir
        </button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="row mb-4 align-items-center">
      <div class="col-md-8">
        <h2 class="fw-bold mb-1" style="color: rgb(215, 236, 250);">Conoce a los demás! :D</h2>
        <p class="text-secondary mb-0">Compañeros registrados en la materia</p>
      </div>
      <div class="col-md-4 mt-3 mt-md-0 search-wrap">
        <div class="input-group">
          <span class="input-group-text border-end-0"><i class="bi bi-search"></i></span>
          <input type="text" id="search-input" class="form-control border-start-0" placeholder="Buscar compañero...">
        </div>
      </div>
    </div>

    <!-- Indicador de carga visible -->
    <div id="loading-msg" class="text-center py-5">
      <div class="spinner-border text-info" role="status"></div>
      <p class="mt-2 text-light">Cargando compañeros...</p>
    </div>

    <div class="row g-4" id="students-grid"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://lpgesqdonpofoerpopkk.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_utnY7OECRDGSr5bbOixnFQ__W4iaOGH";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    // ✅ Guard de Sesión
    const usuarioActivo = JSON.parse(sessionStorage.getItem("usuarioActivo") || "null");

    if (!usuarioActivo) {
      window.location.href = "index.html";
    } else {
      document.getElementById("user-display").innerHTML =
        `<i class="bi bi-person-circle"></i> ${usuarioActivo.nombre_completo}`;

      // Mostrar botón "Modo Privado" solo si es privilegiado o docente
      if (usuarioActivo.rol === "privilegiado" || usuarioActivo.rol === "docente") {
        document.getElementById("btn-modo-privado").classList.remove("d-none");
      }
    }

    const grid = document.getElementById("students-grid");
    const loadingMsg = document.getElementById("loading-msg");
    let estudiantes = [];

    async function cargarEstudiantes() {
      const { data, error } = await supabaseClient
        .from("usuarios")
        .select("*")
        .or("activo.eq.true,activo.is.null")
        .order("nombre_completo", { ascending: true });

      loadingMsg.classList.add("d-none");

      if (error) {
        console.error("Error Supabase:", error);
        grid.innerHTML = `<p class="text-danger">No se pudo cargar el directorio de compañeros.</p>`;
        return;
      }

      estudiantes = data;
      renderEstudiantes(estudiantes);
    }

    function renderEstudiantes(lista) {
      grid.innerHTML = "";
      if (lista.length === 0) {
        grid.innerHTML = `<p class="text-muted">No se encontraron compañeros.</p>`;
        return;
      }

      const esDocente = (usuarioActivo && usuarioActivo.rol === "docente");

      lista.forEach((est) => {
        const contenidoAvatar = est.foto_perfil 
          ? `<img src="${est.foto_perfil}" style="width: 100%; height: 100%; object-fit: cover;">`
          : `<i class="bi bi-person"></i>`;

        const btnEliminar = esDocente && est.rol !== "docente"
          ? `<button class="btn btn-sm btn-outline-danger w-100 mt-2" onclick="deshabilitarUsuario('${est.id}')"><i class="bi bi-person-x-fill"></i> Dar de Baja</button>`
          : ``;

        grid.innerHTML += `
          <div class="col-12 col-sm-6 col-lg-3">
            <div class="card student-card p-3 text-center shadow-sm h-100">
              <a href="perfil.html?id=${est.id}" class="text-decoration-none text-light">
                <div class="avatar-circle mb-3">${contenidoAvatar}</div>
                <h5 class="fw-bold mb-1">${est.nombre_completo}</h5>
              </a>
              <p class="text-muted small mb-2">RU: ${est.ru}</p>
              <div class="mt-auto pt-3 border-top d-flex align-items-center justify-content-between">
                <span class="badge badge-respeto rounded-pill px-3 py-2">
                  <i class="bi bi-star-fill text-warning"></i> <span id="respeto-${est.id}">${est.respetos || 0}</span> Respetos
                </span>
                <button class="btn btn-sm btn-outline-primary rounded-circle" onclick="darRespeto('${est.id}')" title="Dar +1 Respeto">
                  <i class="bi bi-hand-thumbs-up-fill"></i>
                </button>
              </div>
              ${btnEliminar}
            </div>
          </div>
        `;
      });
    }

    async function deshabilitarUsuario(id) {
      if (confirm("¿Estás seguro de que deseas deshabilitar a este estudiante del sistema?")) {
        await supabaseClient.from("usuarios").update({ activo: false }).eq("id", id);
        cargarEstudiantes();
      }
    }

    async function darRespeto(id) {
      if (!usuarioActivo) return;
      if (id === usuarioActivo.id) {
        alert("No puedes darte +1 Respeto a ti mismo 😉");
        return;
      }

      const { error: logError } = await supabaseClient
        .from("respetos_log")
        .insert([{ emisor_ru: usuarioActivo.ru, receptor_id: id }]);

      if (logError) {
        alert("Ya le diste +1 Respeto a esta persona");
        return;
      }

      const est = estudiantes.find((e) => e.id === id);
      const nuevoTotal = (est.respetos || 0) + 1;

      const { error: updateError } = await supabaseClient
        .from("usuarios")
        .update({ respetos: nuevoTotal })
        .eq("id", id);

      if (!updateError) {
        est.respetos = nuevoTotal;
        document.getElementById(`respeto-${id}`).textContent = nuevoTotal;
      }
    }

    function cerrarSesion() {
      sessionStorage.removeItem("usuarioActivo");
      window.location.href = "index.html";
    }

    document.getElementById("search-input").addEventListener("input", (e) => {
      const texto = e.target.value.trim().toLowerCase();
      const filtrados = estudiantes.filter((est) =>
        est.nombre_completo.toLowerCase().includes(texto)
      );
      renderEstudiantes(filtrados);
    });

    if (usuarioActivo) {
      cargarEstudiantes();
    }
  </script>
</body>
</html>
